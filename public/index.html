<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自分の情報</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <h1>自分の情報</h1>
      <button type="button" id="open-settings" class="icon-button" aria-label="設定" title="設定">⚙</button>
    </div>
    <p class="subtitle">テキストと画像で自分の情報をまとめておく場所。各項目は別の項目の下にネストできます。</p>
  </header>

  <section class="card">
    <h2>新しい項目を追加</h2>
    <form id="add-form">
      <div id="pending-parent" class="pending-parent hidden">
        <span class="pending-parent-label">追加先:</span>
        <strong id="pending-parent-name"></strong>
        <button type="button" id="clear-pending-parent" aria-label="親なしに戻す">×</button>
      </div>

      <div class="field">
        <span class="field-label">タイプ</span>
        <div class="type-toggle">
          <label><input type="radio" name="type" value="text" checked> テキスト</label>
          <label><input type="radio" name="type" value="image"> 画像</label>
        </div>
      </div>

      <label class="field">
        <span class="field-label">項目名</span>
        <input type="text" id="label-input" placeholder="例: メールアドレス / 連絡先" required>
      </label>

      <div id="text-input-area" class="field">
        <span class="field-label">値</span>
        <textarea id="text-value" rows="3" placeholder="ここに内容を入力"></textarea>
      </div>

      <div id="image-input-area" class="field hidden">
        <span class="field-label">画像</span>
        <div id="paste-zone" tabindex="0">
          <span class="paste-hint">ここをクリックして <kbd>Ctrl</kbd>+<kbd>V</kbd> でペースト</span>
          <img id="paste-preview" class="hidden" alt="preview">
        </div>
        <button type="button" id="clear-image" class="link-button hidden">画像をクリア</button>
      </div>

      <div class="actions">
        <button type="submit" id="submit-btn">追加</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>登録されている情報</h2>
    <div id="items-list" class="items-list">
      <p class="empty">まだ項目はありません。</p>
    </div>
  </section>

  <div id="viewer" class="viewer hidden">
    <button type="button" id="viewer-close" aria-label="閉じる">×</button>
    <img id="viewer-image" alt="">
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>設定</h3>
        <button type="button" id="settings-close" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <label class="setting-row">
          <input type="checkbox" id="confirm-reveal-toggle">
          <span>隠した項目を表示する前に確認ポップアップを出す</span>
        </label>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>表示の確認</h3>
      </div>
      <div class="modal-body">
        <p>「<span id="confirm-item-name"></span>」を表示します。よろしいですか?</p>
      </div>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirm-ok" class="primary">表示する</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
